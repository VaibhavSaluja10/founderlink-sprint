spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/founderlink_user_sprint?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  config:
    import: optional:configserver:http://localhost:8887

server:
  port: 8062

