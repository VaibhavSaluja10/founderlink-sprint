server:
  port: 8887
spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/capgemini-2026/FounderLink_Sprint_New_26March
          default-label: main
          clone-on-start: true
          force-pull: true
          timeout: 5

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8760/eureka/
    register-with-eureka: true
    fetch-registry: true
