spring:
  application:
    name: notification-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://mysql-db:3306/founderlink_notification_sprint?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  config:
    import: optional:configserver:http://config-server:8887
  rabbitmq:
    host: rabbitmq
    port: 5672
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

founderlink:
  notifications:
    from-email: ${MAIL_FROM:no-reply@founderlink.com}
    investor-alert-emails: ${INVESTOR_ALERT_EMAILS:}

server:
  port: 8067

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-service:8760/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

jwt:
  secret: 9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
