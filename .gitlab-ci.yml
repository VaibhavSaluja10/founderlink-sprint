stages:
  - build
  - test

variables:
  # This will store maven dependencies locally to speed up subsequent builds
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

# Cache dependencies for faster pipeline executions
cache:
  paths:
    - .m2/repository/
    - founderlink-frontend/node_modules/

# ---------------------------------------------------------
# BACKEND JOBS (Spring Boot Microservices)
# ---------------------------------------------------------

build-backend:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    # Build all modules defined in the root pom.xml
    - echo "Building Spring Boot Microservices..."
    - mvn clean package -DskipTests
  artifacts:
    paths:
      # Save the generated jar files to be used in later stages (like docker build or deploy)
      - "*/target/*.jar"
    expire_in: 1 week

test-backend:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - echo "Running backend unit tests..."
    - mvn test
  # We allow this to fail just in case some generated tests are currently broken
  allow_failure: true
  dependencies:
    - build-backend

# ---------------------------------------------------------
# FRONTEND JOBS (React UI)
# ---------------------------------------------------------

build-frontend:
  stage: build
  image: node:20
  script:
    - echo "Building React Frontend..."
    - cd founderlink-frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      # Save the production build folder
      - founderlink-frontend/dist/
    expire_in: 1 week
